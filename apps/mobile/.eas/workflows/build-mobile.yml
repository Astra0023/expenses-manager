name: Mobile Preview Builds

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"

jobs:
  build_android:
    name: Build Android APK
    type: build
    params:
      platform: android
      profile: preview

  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: preview
